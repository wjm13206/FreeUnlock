name: Build
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/keystore.jks
          fi

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_ALIAS_PASS: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}
        run: |
          chmod +x ./gradlew
          SIGN_ARGS=""
          if [ -n "$KEYSTORE_BASE64" ]; then
            SIGN_ARGS="-DAndroid_Keystore_Path=${{ runner.temp }}/keystore.jks -DAndroid_Keystore_Password=$KEYSTORE_PASS -DAndroid_Keystore_Alias=$KEYSTORE_ALIAS -DAndroid_Keystore_Alias_Password=$KEY_ALIAS_PASS"
          fi
          ./gradlew assembleDebug assembleRelease $SIGN_ARGS
          ./gradlew bundleDebug bundleRelease $SIGN_ARGS

      - name: Output info
        run: |
          sudo apt update
          sudo apt install tree -y
          tree .
          cat app/src/main/AndroidManifest.xml

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: All build outputs
          path: app/build/outputs/

      - name: Upload APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: APK bundle
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release*.apk
            app/build/outputs/bundle/debug/app-debug.aab
            app/build/outputs/bundle/release/app-release.aab